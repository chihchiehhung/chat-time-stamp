<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Chat Time Stamp</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1 class="title">Chat Time Stamp</h1>
        <label class="switch">
          <input type="checkbox" class="switch-input" id="enabled-toggle"
              aria-label="Append local time on send">
          <span class="switch-track"></span>
        </label>
      </header>
      <p class="description">
        Adds your local time to the end of every message you send, so the AI
        knows what time it is.
      </p>
      <p class="status" id="status-text"></p>
      <p class="sites">Currently supports Claude and Gemini</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
